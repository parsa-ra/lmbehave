dataset_path: lmms-lab/MMMU
task: repdyn_mmmu_val
test_split: validation
output_type: generate_until
doc_to_visual: !function utils.mmmu_doc_to_visual
doc_to_text: !function utils.mmmu_doc_to_text
doc_to_target: answer
doc_to_messages: !function utils.mmmu_doc_to_messages
process_results: !function utils.mmmu_process_results
generation_kwargs:
  max_new_tokens: 16
  temperature: 0.0
  do_sample: false
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
metric_list:
  - metric: mmmu_acc
    aggregation: !function utils.mmmu_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    prompt_type: format
    multiple_choice_prompt: "Return only the option letter."
    open_ended_prompt: "Return only the shortest correct word, phrase, or number."
  qwen3_vl:
    format: qwen3_vl
    pre_prompt: "Question: "
    post_prompt: "Return only the option letter."
    open_ended_prompt: "Return only the shortest correct word, phrase, or number."
metadata:
  version: 1.0
  interleaved_format: false
