task: repdyn_triviaqa_direct
dataset_path: mandarjoshi/trivia_qa
dataset_name: rc.nocontext
dataset_kwargs:
  revision: 0f7faf33a3908546c6fd5b73a660e0f8ff173c2f
validation_split: validation
output_type: generate_until
doc_to_visual: null
doc_to_text: !function utils.triviaqa_doc_to_text
doc_to_target: "{{answer.value}}"
process_results: !function utils.triviaqa_process_results
generation_kwargs:
  max_new_tokens: 16
  temperature: 0.0
  do_sample: false
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
metric_list:
  - metric: accuracy
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  protocol: concise_closed_book_non_leaderboard

